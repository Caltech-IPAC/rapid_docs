version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      # The same command CI runs. Read the Docs' default adds -j auto, and
      # ABlog is not parallel-read safe, which -W turns into a failure.
      html:
        - python -m sphinx -T -W --keep-going -b html -d _build/doctrees . $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements.txt
